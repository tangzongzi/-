<div class="main">
  <div class="topbar">
    <div>
      <h1>每日经营日报</h1>
      <div class="topbar-sub">每天的销售额 / 退款额 / 增长商品 / 退款率</div>
    </div>
    <div class="topbar-badges">
      <span class="badge badge-data" id="badge-latest">-</span>
      <span class="badge badge-period" id="badge-days">-</span>
    </div>
  </div>

  <div class="kpi-strip" id="kpi-strip"></div>

  <div class="grid grid-2">
    <div class="card">
      <div class="card-title">每日销售走势<span class="has-tip"><span class="tip-icon">?</span><span class="tip-text">每天的订单+金额双轴趋势。柱形=订单数，折线=金额。可判断销售是增长还是下降。</span></span></div>
      <div id="chart-daily" class="chart"></div>
    </div>
    <div class="card">
      <div class="card-title">每日退款走势<span class="has-tip"><span class="tip-icon">?</span><span class="tip-text">数据说明。详情请查看对应的数据源。</span></span></div>
      <div id="chart-refund" class="chart"></div>
    </div>
  </div>

  <div class="content">
    <div class="card">
    <div class="card-title">每日经营明细<span class="has-tip"><span class="tip-icon">?</span><span class="tip-text">数据说明。详情请查看对应的数据源。</span></span></div>
    <div id="table-container" style="overflow-x:auto;"></div>
  </div>

  <div class="footer">每日经营日报 · 数据每日更新</div>
